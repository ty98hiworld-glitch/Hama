<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stars Case</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
min-height:100vh;
}

.screen{display:none;padding:20px;}
.screen.active{display:block;}

.header{
text-align:center;
font-size:26px;
margin:20px 0;
font-weight:bold;
}

.balance{
text-align:center;
font-size:22px;
margin-bottom:20px;
}

.case-card{
max-width:300px;
margin:0 auto;
background:#1f2937;
padding:20px;
border-radius:20px;
text-align:center;
}

.case-icon{font-size:80px;margin:10px 0;}

.btn{
background:#2AABEE;
border:none;
color:white;
padding:14px 25px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.2s;
}

.btn:disabled{
opacity:.4;
cursor:not-allowed;
transform:none;
}

.roulette-wrap{margin-top:30px;position:relative;}
.pointer{
position:absolute;
left:50%;
transform:translateX(-50%);
top:-10px;
font-size:40px;
z-index:5;
}

.roulette-box{
overflow:hidden;
height:140px;
border:3px solid #2AABEE;
border-radius:15px;
background:#111827;
}

.roulette{
display:flex;
height:100%;
align-items:center;
}

.item{
width:130px;
height:90px;
margin:0 5px;
flex-shrink:0;
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:20px;
}

.common{background:#6b7280;}
.rare{background:#2563eb;}
.epic{background:#9333ea;}
.legend{background:#f59e0b;}

.result{
text-align:center;
margin-top:20px;
font-size:24px;
min-height:40px;
}
</style>
</head>

<body>

<div id="menu" class="screen active">

<div class="header">⭐ Stars Case</div>

<div class="balance">
Баланс: <span id="balanceMenu">0</span> ⭐
</div>

<div class="case-card">

<div class="case-icon">🎁</div>

<h3>Бесплатный кейс</h3>
<p>Раз в 24 часа</p>

<button id="openBtn" class="btn" onclick="openCase()">
Открыть
</button>

</div>

</div>

<div id="case" class="screen">

<div class="header">🎰 Открытие</div>

<div class="balance">
Баланс: <span id="balanceCase">0</span> ⭐
</div>

<div class="roulette-wrap">
<div class="pointer">⬇️</div>
<div class="roulette-box">
<div class="roulette" id="roulette"></div>
</div>
</div>

<div class="result" id="result"></div>

<div style="text-align:center;margin-top:20px;">
<button class="btn" onclick="back()">Назад</button>
</div>

</div>

<script>

const COOLDOWN = 24*60*60*1000;

const prizes = [
{name:"1⭐",value:1,cls:"common",chance:40},
{name:"2⭐",value:2,cls:"common",chance:25},
{name:"5⭐",value:5,cls:"rare",chance:18},
{name:"10⭐",value:10,cls:"rare",chance:10},
{name:"25⭐",value:25,cls:"epic",chance:5},
{name:"50⭐",value:50,cls:"legend",chance:2}
];

let stars = Number(localStorage.getItem("stars")) || 0;

function update(){
document.getElementById("balanceMenu").textContent = stars;
document.getElementById("balanceCase").textContent = stars;
}
update();

function formatTime(ms){
let s = Math.floor(ms/1000);
let h = Math.floor(s/3600);
let m = Math.floor((s%3600)/60);
let sec = s%60;
return `${h}ч ${m}м ${sec}с`;
}

function updateButtonTimer(){
const btn = document.getElementById("openBtn");
const last = Number(localStorage.getItem("lastFree")) || 0;
const now = Date.now();

const diff = COOLDOWN - (now - last);

if(diff > 0){
btn.disabled = true;
btn.textContent = "⏳ " + formatTime(diff);
}else{
btn.disabled = false;
btn.textContent = "Открыть";
}
}

setInterval(updateButtonTimer,1000);
updateButtonTimer();

function weighted(){
let sum=0;
for(let p of prizes) sum+=p.chance;

let r=Math.random()*sum;

for(let p of prizes){
r-=p.chance;
if(r<=0) return p;
}
return prizes[0];
}

function openCase(){

const last = Number(localStorage.getItem("lastFree")) || 0;
const now = Date.now();

if(now - last < COOLDOWN) return;

document.getElementById("menu").classList.remove("active");
document.getElementById("case").classList.add("active");

startSpin();
}

function back(){
document.getElementById("case").classList.remove("active");
document.getElementById("menu").classList.add("active");
}

function startSpin(){

const roulette=document.getElementById("roulette");
const result=document.getElementById("result");

roulette.innerHTML="";
result.innerHTML="";

const win=weighted();

for(let i=0;i<60;i++){
let p=prizes[Math.floor(Math.random()*prizes.length)];
if(i===50)p=win;

const div=document.createElement("div");
div.className="item "+p.cls;
div.textContent=p.name;
roulette.appendChild(div);
}

const itemW=140;
const center=(document.querySelector(".roulette-box").offsetWidth/2)-(itemW/2);
const offset=-(50*itemW)+center;

roulette.style.transition="transform 6s cubic-bezier(.08,.6,0,1)";
roulette.style.transform=`translateX(${offset}px)`;

setTimeout(()=>{

stars+=win.value;
localStorage.setItem("stars",stars);
localStorage.setItem("lastFree",Date.now());

update();

result.innerHTML=`🎉 Вы выиграли <b>${win.name}</b>`;

},6200);

}

</script>

</body>
  </html>
